name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end test (real app)
        if: runner.os != 'Linux'
        run: npm run test:e2e
      - name: End-to-end test (real app, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e

  install:
    name: Install and self-test (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
          - os: macos-latest
            dist: dist:mac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run check:install
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: self-test-${{ matrix.os }}
          path: self-test-reports/
          retention-days: 30
      - name: Keep the installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/RTStoryTracker-*.exe
            release/RTStoryTracker-*.dmg
            release/RTStoryTracker-*.deb
            release/RTStoryTracker-*.AppImage
          retention-days: 14
